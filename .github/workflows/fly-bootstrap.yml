name: Bootstrap OmniRoute on Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Fly configuration
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib

          with open("fly.toml", "rb") as file:
              config = tomllib.load(file)

          mounts = config.get("mounts", [])
          values = {
              "FLY_APP": config.get("app"),
              "FLY_REGION": config.get("primary_region"),
              "FLY_VOLUME": mounts[0].get("source") if mounts else None,
          }
          for name, value in values.items():
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"fly.toml must define {name}")
              print(f"{name}={value}")
          PY

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Create app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          if ! flyctl apps create "$FLY_APP" --org "$FLY_ORG"; then
            flyctl apps show "$FLY_APP" >/dev/null
          fi

          for attempt in {1..12}; do
            if flyctl apps show "$FLY_APP" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          flyctl apps show "$FLY_APP" >/dev/null

      - name: Create volume if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
        run: |
          for attempt in {1..12}; do
            if flyctl volumes list --app "$FLY_APP" --json \
              | jq -e --arg name "$FLY_VOLUME" --arg region "$FLY_REGION" \
                'any(.[]; .name == $name and .region == $region)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          flyctl volumes create "$FLY_VOLUME" \
            --app "$FLY_APP" \
            --region "$FLY_REGION" \
            --size 10 \
            --yes

      - name: Set OmniRoute application secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
          INITIAL_PASSWORD: ${{ secrets.INITIAL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          MACHINE_ID_SALT: ${{ secrets.MACHINE_ID_SALT }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          OMNIROUTE_WS_BRIDGE_SECRET: ${{ secrets.OMNIROUTE_WS_BRIDGE_SECRET }}
        run: |
          : "${JWT_SECRET:?Missing JWT_SECRET secret}"
          : "${API_KEY_SECRET:?Missing API_KEY_SECRET secret}"
          : "${OMNIROUTE_WS_BRIDGE_SECRET:?Missing OMNIROUTE_WS_BRIDGE_SECRET secret}"

          secrets=(
            "JWT_SECRET=$JWT_SECRET"
            "API_KEY_SECRET=$API_KEY_SECRET"
            "OMNIROUTE_WS_BRIDGE_SECRET=$OMNIROUTE_WS_BRIDGE_SECRET"
          )
          [ -z "$INITIAL_PASSWORD" ] || secrets+=("INITIAL_PASSWORD=$INITIAL_PASSWORD")
          [ -z "$MACHINE_ID_SALT" ] || secrets+=("MACHINE_ID_SALT=$MACHINE_ID_SALT")
          [ -z "$STORAGE_ENCRYPTION_KEY" ] || secrets+=("STORAGE_ENCRYPTION_KEY=$STORAGE_ENCRYPTION_KEY")
          flyctl secrets set "${secrets[@]}" --app "$FLY_APP"

      - name: Deploy application
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
        run: flyctl deploy --remote-only --config ./fly.toml
